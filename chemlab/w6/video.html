<script>
(() => {

const back = new THREE.DirectionalLight(0xffffff, 0.35); back.position.set(-6, 4, -5); scene.add(back);
// 実験台

bench.position.y = -0.2; scene.add(bench);

// ---------- 補助
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const seg = (t, a, b) => ease((t - a) / (b - a));
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      const u = ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((x, j) => x + (v1[j] - x) * u) : v0 + (v1 - v0) * u;
    }
  }
  return keys[keys.length - 1][1];
}
const C = {
  alum: new THREE.Color(0xd9b34a), water: new THREE.Color(0xbfe3f5), clear: new THREE.Color(0xf3f0e2),
  red: new THREE.Color(0xd8361c), purple: new THREE.Color(0x6a2c9c), pale: new THREE.Color(0xf0e08a),

};
const mix = (a, b, u) => new THREE.Color().lerpColors(a, b, Math.max(0, Math.min(1, u)));

  const w = Math.ceil(g.measureText(text).width) + pad * 2, h = fs + pad * 1.4;

  g.fillStyle = o.bg || 'rgba(255,255,255,0.92)';
  const r = 18; g.beginPath(); g.moveTo(r, 0); g.arcTo(w, 0, w, h, r); g.arcTo(w, h, 0, h, r); g.arcTo(0, h, 0, 0, r); g.arcTo(0, 0, w, 0, r); g.fill();
  g.fillStyle = o.color || '#1d2a3a'; g.textBaseline = 'middle'; g.fillText(text, pad, h / 2 + 2);
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;

}

const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
// 回転体の容器(ガラス + 液)
function vessel(profile, o = {}) {
  const g = new THREE.Group();
  const pts = profile.map(([r, y]) => new THREE.Vector2(r, y));
  const glass = new THREE.Mesh(new THREE.LatheGeometry(pts, 48), glassMat()); glass.renderOrder = 2; g.add(glass);
  const inner = profile.map(([r, y]) => [r * 0.9, y]);
  const liq = new THREE.Mesh(new THREE.BufferGeometry(), liqMat(C.water)); liq.renderOrder = 1; g.add(liq);
  let key = '';
  g.setLevel = (lv, color, op = 0.82) => {
    const k = lv.toFixed(3);
    if (k !== key) {
      key = k; liq.geometry.dispose();
      const p = [new THREE.Vector2(0, inner[0][1] + 0.005)];
      for (let i = 0; i < inner.length; i++) {
        const [r, y] = inner[i];
        if (y < lv) p.push(new THREE.Vector2(r, Math.max(y, inner[0][1] + 0.005)));
        else { const [r0, y0] = inner[i - 1] || inner[0]; const u = (lv - y0) / (y - y0 || 1); p.push(new THREE.Vector2(r0 + (r - r0) * u, lv)); break; }
      }
      p.push(new THREE.Vector2(0, lv));
      liq.geometry = lv > inner[0][1] + 0.01 ? new THREE.LatheGeometry(p, 40) : new THREE.BufferGeometry();
    }
    if (color) liq.material.color.copy(color);
    liq.material.opacity = op;
  };
  if (o.mark) {
    const m = new THREE.Mesh(new THREE.TorusGeometry(o.mark[0] + 0.004, 0.008, 6, 40), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    m.rotation.x = Math.PI / 2; m.position.y = o.mark[1]; g.add(m);
  }
  return g;
}
const flaskProfile = (s) => [[0.0, 0], [0.62, 0], [0.86, 0.14], [0.96, 0.48], [0.9, 0.84], [0.6, 1.18], [0.22, 1.42], [0.16, 1.58], [0.16, 3.1], [0.19, 3.2]].map(([r, y]) => [r * s, y * s]);

  const g = vessel(flaskProfile(s), { mark: [0.16 * s * 0.9, 2.55 * s] });
  const stopper = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.15 * s, 0.25 * s, 20), new THREE.MeshPhongMaterial({ color: 0xf2f2f2, transparent: true, opacity: 0.8 }));
  stopper.position.y = 3.3 * s; stopper.visible = false; g.add(stopper); g.stopper = stopper;
  g.markY = 2.55 * s;
  return g;
}
const beakerProfile = (s) => [[0, 0], [0.7, 0], [0.72, 0.05], [0.72, 1.6], [0.78, 1.66]].map(([r, y]) => [r * s, y * s]);
const conicalProfile = [[0, 0], [0.95, 0], [1.0, 0.1], [0.4, 1.7], [0.34, 1.9], [0.34, 2.3], [0.4, 2.36]];

  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.012, 0.35, 12), gm); tip.position.y = 0.175; g.add(tip);
  const low = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, len * 0.33, 12), gm); low.position.y = 0.35 + len * 0.165; g.add(low);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 14), gm); bulb.scale.y = 2.2; bulb.position.y = 0.35 + len * 0.33 + 0.28; g.add(bulb);
  const up = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len * 0.45, 12), gm); up.position.y = 0.35 + len * 0.33 + 0.56 + len * 0.225; g.add(up);
  const mark = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.006, 6, 20), new THREE.MeshBasicMaterial({ color: 0x333333 }));
  mark.rotation.x = Math.PI / 2; mark.position.y = 0.35 + len * 0.33 + 0.56 + len * 0.12; g.add(mark);
  const pip = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.5, 14), new THREE.MeshPhongMaterial({ color: 0x2e7bd6 }));
  pip.position.y = 0.35 + len * 0.33 + 0.56 + len * 0.45 + 0.25; g.add(pip);
  const liq = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 10), liqMat(C.alum)); g.add(liq);
  const lb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), liqMat(C.alum)); lb.scale.y = 2.1; lb.position.y = bulb.position.y; g.add(lb);
  const markY = mark.position.y, topBulb = bulb.position.y;
  g.setFill = (f, color) => { // f: 0..1(1 で標線)
    const h = Math.max(0.001, 0.05 + f * (markY - 0.05));
    liq.scale.y = h; liq.position.y = h / 2; liq.visible = f > 0.002;
    lb.visible = h > topBulb - 0.2; lb.scale.set(1, 2.1 * Math.min(1, (h - (topBulb - 0.3)) / 0.6 + 0.01), 1);
    if (color) { liq.material.color.copy(color); lb.material.color.copy(color); }

}
// 駒込ピペット
function dropper(color) {

  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.012, 0.3, 10), gm); tip.position.y = 0.1; g.add(tip);

  const clamp = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.12), new THREE.MeshPhongMaterial({ color: 0x9aa4ae })); clamp.position.set(-0.45, 4.6, -0.15); g.add(clamp);
  return g;

// セル
function cuvette(color) {

  const gl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.2, 0.34), glassMat()); gl.position.y = 0.6; gl.renderOrder = 2; g.add(gl);

// グラフの画面(キャンバスの板)
function screen(w = 2.4, h = 1.5) {

  const tex = new THREE.CanvasTexture(cv);

// ---------- 実験7 用の部品
// 液はどれも無色なので、区別のための仮の色を付ける
const C7 = {
  h2so4: new THREE.Color(0xf6d5dc), naoh: new THREE.Color(0xe0d6f5), hac: new THREE.Color(0xd8f0d2),
  naac: new THREE.Color(0xf3ecc8), bufA: new THREE.Color(0xcfe6fa), bufB: new THREE.Color(0xbfe0d8), acid: new THREE.Color(0xf5f2e4)

// 模式スペクトル(仮の形。p-ニトロ安息香酸のつもりで、等吸収点が約 275 nm に来るようにした)
const A_HA = (l) => 0.92 * Math.exp(-((l - 258) ** 2) / (2 * 20 * 20)) + 0.05;
const A_A = (l) => 0.80 * Math.exp(-((l - 290) ** 2) / (2 * 24 * 24)) + 0.05;
const A_E = (l, a) => (1 - a) * A_HA(l) + a * A_A(l);
const ALPHA = 0.57; // 緩衝液 A 中で解離している割合(pKa 3.44、pH 3.56 のとき約 0.57)

  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 80; const tex = new THREE.CanvasTexture(cv);

  g.show('0.00 g');
  return g;
}
function spectro(g) {

  const beam2 = beam.clone(); beam2.material = beam.material.clone(); g.add(beam2); g.beam2 = beam2;

function legend(g2, col, name, k) {

// スペクトルの画面:list = [[関数, 色, 名前]]、upto = 描く波長の上限
function drawSpec(g2, list, upto, o = {}) {
  axes(g2, '波長 [nm]', '吸光度');
  const X = (l) => 70 + (l - 250) / 90 * 540, Y = (a) => 340 - a / 1.0 * 300;
  g2.fillStyle = '#9fb2c6'; g2.font = '22px sans-serif';
  [250, 275, 300, 325].forEach((l) => g2.fillText(l, X(l) - 18, 368));
  list.forEach(([f, col, name], k) => {
    g2.strokeStyle = col; g2.lineWidth = 5; g2.beginPath();
    for (let l = 250; l <= Math.min(340, upto); l += 1) { const x = X(l), y = Y(f(l)); l === 250 ? g2.moveTo(x, y) : g2.lineTo(x, y); }
    g2.stroke();

        c2.fillStyle = '#ffe08a'; c2.font = 'bold 21px "Yu Gothic",sans-serif';
        c2.fillText('pKa = pH + log((Aₑ−A(A⁻))/(A(HA)−Aₑ))', 86, 186);
        c2.fillStyle = '#cfe0f0'; c2.font = '19px "Yu Gothic",sans-serif'; c2.fillText('pH は緩衝液 A 3.56 / B 4.46。曲線は模式', 86, 228);
      }
    });
    camera.position.set(0, 2.2, 6.0); camera.lookAt(0, 2.2, 0);
  }
});

addScene({
  name: 'まとめ', dur: 7,
  cap: ['まとめ:硫酸・NaOH・緩衝液の 3 つの pH で同じ濃度の酸のスペクトルを測る → 等吸収点を確かめる → (7・15) 式で pKa', 'p-ニトロ(電子求引性)は安息香酸より強い酸、p-メトキシ(共鳴で電子供与性)は弱い酸になるはず(課題 7.6)'],
  build(g) {
    const cols = [C7.h2so4, C7.bufA, C7.naoh];
    ['硫酸', '緩衝液', 'NaOH'].forEach((n, i) => { const c = cuvette(cols[i]); c.position.set(-1.4 + i * 1.4, 0, 0); c.scale.setScalar(1.3); g.add(c); g.add(at(label(n, { size: 0.28 }), -1.4 + i * 1.4, 2.0, 0)); });
  },
  update(t, g) { g.rotation.y = t * 0.15 - 0.4; camera.position.set(0, 1.9, 6.2 - t * 0.1); camera.lookAt(0, 1.0, 0); }
});

// ---------- 再生
const starts = []; let total = 0; S.forEach((s) => { starts.push(total); total += s.dur; });
let cur = -1;
function setScene(i) {
  if (i === cur) return;
  if (G) { scene.remove(G); G.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  G = new THREE.Group(); scene.add(G); S[i].build(G); cur = i;
  document.querySelectorAll('#chap button').forEach((b, k) => b.classList.toggle('on', k === i));
}
function wrap(g, text, maxW) {
  const lines = []; let line = '';
  for (const ch of text) { if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
  if (line) lines.push(line); return lines;
}
function overlay(i, lt) {
  const s = S[i];
  ctx.drawImage(renderer.domElement, 0, 0);
  if (s.title) {
    const a = Math.min(1, lt / 0.8);
    ctx.fillStyle = `rgba(16,29,43,${0.78 * a})`; ctx.fillRect(0, 70, W, 170);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = 'bold 54px "Yu Gothic","Hiragino Sans",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.cap[0], W / 2, 150); ctx.font = '30px "Yu Gothic","Hiragino Sans",sans-serif'; ctx.fillText(s.cap[1], W / 2, 205); ctx.textAlign = 'left';
    return;
  }
  // 場面名(左上)
  ctx.font = 'bold 30px "Yu Gothic","Hiragino Sans",sans-serif';
  const nw = ctx.measureText(s.name).width + 36;
  ctx.fillStyle = 'rgba(46,123,214,0.92)'; ctx.fillRect(24, 22, nw, 52);
  ctx.fillStyle = '#fff'; ctx.fillText(s.name, 42, 58);
  // 字幕(下)
  ctx.font = 'bold 27px "Yu Gothic","Hiragino Sans",sans-serif';
  const l1 = wrap(ctx, s.cap[0], W - 120);
  ctx.font = '23px "Yu Gothic","Hiragino Sans",sans-serif';
  const l2 = wrap(ctx, s.cap[1], W - 120);
  const hh = 26 + l1.length * 38 + l2.length * 32;
  ctx.fillStyle = 'rgba(16,29,43,0.78)'; ctx.fillRect(0, H - hh, W, hh);
  let y = H - hh + 40;
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 27px "Yu Gothic","Hiragino Sans",sans-serif';
  l1.forEach((l) => { ctx.fillText(l, 60, y); y += 38; });
  ctx.fillStyle = '#cfe3f7'; ctx.font = '23px "Yu Gothic","Hiragino Sans",sans-serif';
  l2.forEach((l) => { ctx.fillText(l, 60, y); y += 32; });
  // 進行バー
  const T = starts[i] + lt;
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = '#2e7bd6'; ctx.fillRect(0, H - 6, W * T / total, 6);
}
function renderAt(T) {
  T = Math.max(0, Math.min(total - 0.001, T));
  let i = 0; while (i < S.length - 1 && T >= starts[i + 1]) i++;
  setScene(i);
  const lt = T - starts[i];
  S[i].update(lt, G);
  renderer.render(scene, camera);
  overlay(i, lt);
  bar.value = Math.round(T / total * 1000);
  const f = (x) => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  timeEl.textContent = f(T) + ' / ' + f(total);
}
const bar = document.getElementById('bar'), timeEl = document.getElementById('time'), playB = document.getElementById('play');
const chap = document.getElementById('chap');
S.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => { T0 = starts[i]; if (!playing) renderAt(T0); }; chap.appendChild(b); });
let playing = false, T0 = 0, last = 0;
function loop(now) {
  if (!playing) return;
  T0 += (now - last) / 1000; last = now;
  if (T0 >= total) { T0 = total - 0.001; renderAt(T0); playing = false; playB.textContent = '▶ 再生'; onEnd && onEnd(); return; }
  renderAt(T0); requestAnimationFrame(loop);
}
let onEnd = null;
function play() { if (T0 >= total - 0.01) T0 = 0; playing = true; last = performance.now(); playB.textContent = '⏸ 一時停止'; requestAnimationFrame(loop); }
function pause() { playing = false; playB.textContent = '▶ 再生'; }
playB.onclick = () => (playing ? pause() : play());
out.onclick = () => (playing ? pause() : play());
bar.oninput = () => { T0 = bar.value / 1000 * total; renderAt(T0); };
document.getElementById('prev').onclick = () => { const i = Math.max(0, cur - (T0 - starts[cur] < 1 ? 1 : 0)); T0 = starts[i]; renderAt(T0); };
document.getElementById('next').onclick = () => { const i = Math.min(S.length - 1, cur + 1); T0 = starts[i]; renderAt(T0); };
// 動画ファイルとして保存(再生しながら記録)
document.getElementById('rec').onclick = () => {
  if (!window.MediaRecorder) { alert('このブラウザでは保存できません'); return; }
  const stream = out.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    window.__lastVideo = blob;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jikken7-tejun.webm'; a.click();
  };
  T0 = 0; onEnd = () => { onEnd = null; setTimeout(() => rec.stop(), 300); };
  rec.start(500); play();
};
window.__video = { total, renderAt, starts, S };
window.__autoRec = (url) => {
  const stream = out.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  window.__recState = 'recording';
  rec.onstop = async () => { const blob = new Blob(chunks, { type: 'video/webm' }); window.__recState = 'uploading ' + blob.size; const r = await fetch(url, { method: 'POST', body: blob }); window.__recState = 'done ' + blob.size + ' ' + (await r.text()); };
  T0 = 0; onEnd = () => { onEnd = null; setTimeout(() => rec.stop(), 300); };
  rec.start(1000); play();
};
renderAt(0);
})();
</script>
