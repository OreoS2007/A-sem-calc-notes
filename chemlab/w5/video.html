<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const W = 1280, H = 720;
const out = document.getElementById('out');
const ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe7edf3);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c3cf, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(4, 9, 6); scene.add(sun);
const back = new THREE.DirectionalLight(0xffffff, 0.35); back.position.set(-6, 4, -5); scene.add(back);
// 実験台
const bench = new THREE.Mesh(new THREE.BoxGeometry(30, 0.4, 14), new THREE.MeshLambertMaterial({ color: 0x3f4a56 }));
bench.position.y = -0.2; scene.add(bench);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshLambertMaterial({ color: 0xdfe6ee }));
wall.position.set(0, 8, -6); scene.add(wall);

// ---------- 補助
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const seg = (t, a, b) => ease((t - a) / (b - a));
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      const u = ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((x, j) => x + (v1[j] - x) * u) : v0 + (v1 - v0) * u;
    }
  }
  return keys[keys.length - 1][1];
}
const C = {
  alum: new THREE.Color(0xd9b34a), water: new THREE.Color(0xbfe3f5), clear: new THREE.Color(0xf3f0e2),
  red: new THREE.Color(0xd8361c), purple: new THREE.Color(0x6a2c9c), pale: new THREE.Color(0xf0e08a),
  onsen: new THREE.Color(0xc9c58a), edta: new THREE.Color(0xd6ecf6)
};
const mix = (a, b, u) => new THREE.Color().lerpColors(a, b, Math.max(0, Math.min(1, u)));
const glassMat = () => new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, shininess: 120, specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false });
const liqMat = (c) => new THREE.MeshPhongMaterial({ color: c, transparent: true, opacity: 0.82, shininess: 60 });

// 文字のスプライト
function label(text, o = {}) {
  const fs = o.fs || 56, pad = 18;
  const cv = document.createElement('canvas'); const g = cv.getContext('2d');
  g.font = `bold ${fs}px "Yu Gothic","Hiragino Sans","Meiryo",sans-serif`;
  const w = Math.ceil(g.measureText(text).width) + pad * 2, h = fs + pad * 1.4;
  cv.width = w; cv.height = h;
  g.font = `bold ${fs}px "Yu Gothic","Hiragino Sans","Meiryo",sans-serif`;
  g.fillStyle = o.bg || 'rgba(255,255,255,0.92)';
  const r = 18; g.beginPath(); g.moveTo(r, 0); g.arcTo(w, 0, w, h, r); g.arcTo(w, h, 0, h, r); g.arcTo(0, h, 0, 0, r); g.arcTo(0, 0, w, 0, r); g.fill();
  g.fillStyle = o.color || '#1d2a3a'; g.textBaseline = 'middle'; g.fillText(text, pad, h / 2 + 2);
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  const s = o.size || 0.36; sp.scale.set(s * w / h, s, 1); sp.renderOrder = 10;
  return sp;
}

const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
// 回転体の容器(ガラス + 液)
function vessel(profile, o = {}) {
  const g = new THREE.Group();
  const pts = profile.map(([r, y]) => new THREE.Vector2(r, y));
  const glass = new THREE.Mesh(new THREE.LatheGeometry(pts, 48), glassMat()); glass.renderOrder = 2; g.add(glass);
  const inner = profile.map(([r, y]) => [r * 0.9, y]);
  const liq = new THREE.Mesh(new THREE.BufferGeometry(), liqMat(C.water)); liq.renderOrder = 1; g.add(liq);
  let key = '';
  g.setLevel = (lv, color, op = 0.82) => {
    const k = lv.toFixed(3);
    if (k !== key) {
      key = k; liq.geometry.dispose();
      const p = [new THREE.Vector2(0, inner[0][1] + 0.005)];
      for (let i = 0; i < inner.length; i++) {
        const [r, y] = inner[i];
        if (y < lv) p.push(new THREE.Vector2(r, Math.max(y, inner[0][1] + 0.005)));
        else { const [r0, y0] = inner[i - 1] || inner[0]; const u = (lv - y0) / (y - y0 || 1); p.push(new THREE.Vector2(r0 + (r - r0) * u, lv)); break; }
      }
      p.push(new THREE.Vector2(0, lv));
      liq.geometry = lv > inner[0][1] + 0.01 ? new THREE.LatheGeometry(p, 40) : new THREE.BufferGeometry();
    }
    if (color) liq.material.color.copy(color);
    liq.material.opacity = op;
  };
  if (o.mark) {
    const m = new THREE.Mesh(new THREE.TorusGeometry(o.mark[0] + 0.004, 0.008, 6, 40), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    m.rotation.x = Math.PI / 2; m.position.y = o.mark[1]; g.add(m);
  }
  return g;
}
const flaskProfile = (s) => [[0.0, 0], [0.62, 0], [0.86, 0.14], [0.96, 0.48], [0.9, 0.84], [0.6, 1.18], [0.22, 1.42], [0.16, 1.58], [0.16, 3.1], [0.19, 3.2]].map(([r, y]) => [r * s, y * s]);
function volFlask(s = 1) {
  const g = vessel(flaskProfile(s), { mark: [0.16 * s * 0.9, 2.55 * s] });
  const stopper = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.15 * s, 0.25 * s, 20), new THREE.MeshPhongMaterial({ color: 0xf2f2f2, transparent: true, opacity: 0.8 }));
  stopper.position.y = 3.3 * s; stopper.visible = false; g.add(stopper); g.stopper = stopper;
  g.markY = 2.55 * s;
  return g;
}
const beakerProfile = (s) => [[0, 0], [0.7, 0], [0.72, 0.05], [0.72, 1.6], [0.78, 1.66]].map(([r, y]) => [r * s, y * s]);
const conicalProfile = [[0, 0], [0.95, 0], [1.0, 0.1], [0.4, 1.7], [0.34, 1.9], [0.34, 2.3], [0.4, 2.36]];

// ホールピペット(先端が原点)
function pipette(len = 3.2) {
  const g = new THREE.Group();
  const gm = glassMat(); gm.opacity = 0.35;
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.012, 0.35, 12), gm); tip.position.y = 0.175; g.add(tip);
  const low = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, len * 0.33, 12), gm); low.position.y = 0.35 + len * 0.165; g.add(low);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 14), gm); bulb.scale.y = 2.2; bulb.position.y = 0.35 + len * 0.33 + 0.28; g.add(bulb);
  const up = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len * 0.45, 12), gm); up.position.y = 0.35 + len * 0.33 + 0.56 + len * 0.225; g.add(up);
  const mark = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.006, 6, 20), new THREE.MeshBasicMaterial({ color: 0x333333 }));
  mark.rotation.x = Math.PI / 2; mark.position.y = 0.35 + len * 0.33 + 0.56 + len * 0.12; g.add(mark);
  const pip = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.5, 14), new THREE.MeshPhongMaterial({ color: 0x2e7bd6 }));
  pip.position.y = 0.35 + len * 0.33 + 0.56 + len * 0.45 + 0.25; g.add(pip);
  const liq = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 10), liqMat(C.alum)); g.add(liq);
  const lb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), liqMat(C.alum)); lb.scale.y = 2.1; lb.position.y = bulb.position.y; g.add(lb);
  const markY = mark.position.y, topBulb = bulb.position.y;
  g.setFill = (f, color) => { // f: 0..1(1 で標線)
    const h = Math.max(0.001, 0.05 + f * (markY - 0.05));
    liq.scale.y = h; liq.position.y = h / 2; liq.visible = f > 0.002;
    lb.visible = h > topBulb - 0.2; lb.scale.set(1, 2.1 * Math.min(1, (h - (topBulb - 0.3)) / 0.6 + 0.01), 1);
    if (color) { liq.material.color.copy(color); lb.material.color.copy(color); }
  };
  g.setFill(0, C.alum);
  return g;
}
// 駒込ピペット
function dropper(color) {
  const g = new THREE.Group(); const gm = glassMat(); gm.opacity = 0.4;
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.02, 1.0, 12), gm); t.position.y = 0.5; g.add(t);
  const l = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.015, 0.6, 10), liqMat(color)); l.position.y = 0.3; g.add(l);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), new THREE.MeshPhongMaterial({ color: 0xb5502c })); b.scale.y = 1.5; b.position.y = 1.12; g.add(b);
  return g;
}
// ビュレット
function burette() {
  const g = new THREE.Group(); const gm = glassMat(); gm.opacity = 0.3;
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 5, 16), gm); tube.position.y = 3.1; g.add(tube);
  for (let i = 0; i <= 10; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.112, 0.004, 4, 20), new THREE.MeshBasicMaterial({ color: 0x334455 })); r.rotation.x = Math.PI / 2; r.position.y = 5.4 - i * 0.45; g.add(r); }
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.04, 0.3, 16), gm); neck.position.y = 0.45; g.add(neck);
  const cock = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), new THREE.MeshPhongMaterial({ color: 0x2b5fae })); cock.position.y = 0.3; g.add(cock); g.cock = cock;
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.012, 0.3, 10), gm); tip.position.y = 0.1; g.add(tip);
  const liq = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 1, 14), liqMat(C.edta)); g.add(liq);
  g.setLevel = (f) => { const h = 0.3 + f * 5.0; liq.scale.y = h; liq.position.y = 0.6 + h / 2 - 0.3; };
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 6.4, 10), new THREE.MeshPhongMaterial({ color: 0x9aa4ae })); stand.position.set(-0.9, 3.0, -0.3); g.add(stand);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 1.2), new THREE.MeshPhongMaterial({ color: 0x9aa4ae })); base.position.set(-0.6, 0.06 - 0.0, -0.3); base.visible = false; g.add(base);
  const clamp = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.12), new THREE.MeshPhongMaterial({ color: 0x9aa4ae })); clamp.position.set(-0.45, 4.6, -0.15); g.add(clamp);
  return g;
}
// セル
function cuvette(color) {
  const g = new THREE.Group();
  const gl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.2, 0.34), glassMat()); gl.position.y = 0.6; gl.renderOrder = 2; g.add(gl);
  const lq = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.9, 0.3), liqMat(color)); lq.position.y = 0.47; g.add(lq); g.liq = lq;
  return g;
}
function drop(color) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), liqMat(color)); m.scale.y = 1.4; return m; }
// グラフの画面(キャンバスの板)
function screen(w = 2.4, h = 1.5) {
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 400;
  const tex = new THREE.CanvasTexture(cv);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  m.draw = (fn) => { const g = cv.getContext('2d'); g.fillStyle = '#0f1d2b'; g.fillRect(0, 0, 640, 400); fn(g); tex.needsUpdate = true; };
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, h + 0.12, 0.06), new THREE.MeshPhongMaterial({ color: 0x2b3440 }));
  frame.position.z = -0.04; m.add(frame);
  return m;
}
function axes(g, xl, yl) {
  g.strokeStyle = '#9fb2c6'; g.lineWidth = 3; g.beginPath(); g.moveTo(70, 30); g.lineTo(70, 340); g.lineTo(610, 340); g.stroke();
  g.fillStyle = '#cfe0f0'; g.font = 'bold 26px "Yu Gothic",sans-serif'; g.fillText(yl, 12, 26); g.textAlign = 'right'; g.fillText(xl, 610, 322); g.textAlign = 'left';
}
// 時計
function clock() {
  const g = new THREE.Group();
  const face = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.08, 40), new THREE.MeshPhongMaterial({ color: 0xffffff })); face.rotation.x = Math.PI / 2; g.add(face);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.05, 8, 40), new THREE.MeshPhongMaterial({ color: 0x2e7bd6 })); g.add(rim);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.45, 0.02), new THREE.MeshPhongMaterial({ color: 0xd8361c })); hand.geometry.translate(0, 0.2, 0); hand.position.z = 0.06; g.add(hand); g.hand = hand;
  return g;
}

// ---------- 実験9 用の部品
const C9 = {
  gel: new THREE.Color(0xdfeef6), stack: new THREE.Color(0xf4f7e6), buf: new THREE.Color(0xcfe8f5),
  blue: new THREE.Color(0x2350c8), dye: new THREE.Color(0x3a5ee0), cbb: new THREE.Color(0x1f2f9a), destain: new THREE.Color(0xd9e6f4)
};
const WELLS = 11, LANE = (i) => -1.0 + (i - 0.5) * (2.0 / WELLS);
// 分子量 → 移動距離 [cm](片対数で直線:d = a − b log10 M。分離ゲル 6 cm)
const DIST = (M) => 12.07 - 5.84 * Math.log10(M);
const MARK = [85, 55, 40, 35, 30, 20, 15];
const SAMPLES = { 1: 45, 3: 14.4, 7: 66, 9: 31, 11: 21.5 }; // 例(試料の番号と種類は実験で決める)
const yOf = (d) => 1.8 - d * (1.55 / 6); // ゲル内の高さ(分離ゲルの上端 1.8)

function gelSet() {
  const g = new THREE.Group();
  const gm = glassMat(); gm.opacity = 0.28;
  const back = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.5, 0.04), gm); back.position.set(0, 1.25, -0.06); g.add(back);
  const front = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.3, 0.04), gm); front.position.set(0, 1.15, 0.06); g.add(front);
  // 切り込み(ガラス板 A の上端)を示す小さな縁
  const sp1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.5, 0.1), new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })); sp1.position.set(-1.15, 1.25, 0); g.add(sp1);
  const sp2 = sp1.clone(); sp2.position.x = 1.15; g.add(sp2);
  const sep = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.6, 0.08), new THREE.MeshPhongMaterial({ color: C9.gel, transparent: true, opacity: 0.6 })); sep.position.set(0, 1.0, 0); g.add(sep); g.sep = sep;
  const water = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.25, 0.08), liqMat(C.water)); water.position.set(0, 1.925, 0); g.add(water); g.water = water;
  const stack = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 0.08), new THREE.MeshPhongMaterial({ color: C9.stack, transparent: true, opacity: 0.7 })); g.add(stack); g.stack = stack;
  g.setStack = (h) => { stack.visible = h > 0.01; stack.scale.y = Math.max(h, 0.01); stack.position.set(0, 1.8 + h / 2, 0); };
  g.setStack(0);
  // ウェル(コームの歯でできるくぼみ)
  g.wells = [];
  for (let i = 1; i <= WELLS; i++) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.22, 0.081), new THREE.MeshPhongMaterial({ color: 0xbfe0f2, transparent: true, opacity: 0.85 }));
    w.position.set(LANE(i), 2.05, 0); w.visible = false; g.add(w); g.wells.push(w);
  }
  // 試料(青い色素入り)
  g.loads = [];
  for (let i = 1; i <= WELLS; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.082), new THREE.MeshPhongMaterial({ color: C9.dye })); s.position.set(LANE(i), 1.98, 0); s.visible = false; g.add(s); g.loads.push(s);
  }
  // 色素の先端(移動の目安)
  g.front = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.035, 0.083), new THREE.MeshPhongMaterial({ color: C9.dye, transparent: true, opacity: 0.9 })); g.front.visible = false; g.add(g.front);
  // タンパク質のバンド
  g.bands = [];
  const addBand = (lane, M, thick) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.14, thick || 0.03, 0.084), new THREE.MeshPhongMaterial({ color: C9.cbb, transparent: true, opacity: 0 }));
    b.userData = { lane, d: DIST(M) }; b.position.set(LANE(lane), 1.8, 0); g.add(b); g.bands.push(b);
  };
  MARK.forEach((M) => addBand(5, M, M === 35 ? 0.04 : 0.028));
  Object.entries(SAMPLES).forEach(([l, M]) => addBand(+l, M, 0.038));
  // u: 泳動の進み(0〜1)、op: バンドの見え方(0 で見えない)
  g.run = (u, op) => {
    g.bands.forEach((b) => { b.position.y = yOf(b.userData.d * u); b.material.opacity = op; });
    g.front.visible = u > 0.02; g.front.position.y = yOf(6.1 * u);
    g.loads.forEach((s) => (s.visible = s.userData.on && u < 0.05));
  };
  return g;
}
// ゲル作成装置(ホルダー + カバー + クリップ)
function caster() {
  const g = new THREE.Group();
  const holder = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.35, 1.0), new THREE.MeshPhongMaterial({ color: 0x9aa7b3 })); holder.position.set(0, 0.175, 0); g.add(holder);
  const backp = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.8, 0.25), new THREE.MeshPhongMaterial({ color: 0xc9d4de, transparent: true, opacity: 0.55 })); backp.position.set(0, 1.4, -0.35); g.add(backp);

  update(t, g) {

    g.order.forEach(([i], j) => { const L = g.s.loads[i - 1]; const done = j < k || (j === k && u > 0.5); L.visible = done; L.position.y = 1.86 + 0.08 * (j === k ? 1 - seg(u, 0.4, 0.7) : 0); });
    g.lbs.forEach((l, j) => (l.visible = j <= k));

  }

function drawSemi(g2, u, show) {
  axes(g2, '移動度 [cm]', '分子量 [kDa](対数)');
  const X = (d) => 70 + d / 6 * 520, Y = (M) => 340 - (Math.log10(M) - 1) / 1.0 * 300;
  g2.fillStyle = '#9fb2c6'; g2.font = '20px sans-serif';
  [10, 20, 50, 100].forEach((M) => g2.fillText(M, 22, Y(M) + 6));
  [0, 2, 4, 6].forEach((d) => g2.fillText(d, X(d) - 6, 366));
  const n = Math.floor(u * 7.99);
  MARK.slice(0, n).forEach((M) => { g2.fillStyle = '#ffb84a'; g2.beginPath(); g2.arc(X(DIST(M)), Y(M), 9, 0, 7); g2.fill(); });
  if (n >= 7) { g2.strokeStyle = '#7fc8ff'; g2.lineWidth = 4; g2.beginPath(); g2.moveTo(X(DIST(90)), Y(90)); g2.lineTo(X(DIST(13)), Y(13)); g2.stroke(); }
  if (show > 0) {
    const M = 31, d = DIST(M);
    g2.setLineDash([10, 8]); g2.strokeStyle = '#ffe08a'; g2.lineWidth = 3;
    g2.beginPath(); g2.moveTo(X(d), 340); g2.lineTo(X(d), 340 - (340 - Y(M)) * Math.min(1, show * 2)); g2.stroke();
    if (show > 0.5) { g2.beginPath(); g2.moveTo(X(d), Y(M)); g2.lineTo(X(d) - (X(d) - 70) * (show - 0.5) * 2, Y(M)); g2.stroke(); }
    g2.setLineDash([]);
    if (show >= 1) { g2.fillStyle = '#ffe08a'; g2.font = 'bold 26px "Yu Gothic",sans-serif'; g2.fillText('試料4 ≈ 31 kDa', X(d) + 12, Y(M) - 10); }
  }
}

// ---------- 再生
const starts = []; let total = 0; S.forEach((s) => { starts.push(total); total += s.dur; });
let cur = -1;
function setScene(i) {
  if (i === cur) return;
  if (G) { scene.remove(G); G.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  G = new THREE.Group(); scene.add(G); S[i].build(G); cur = i;
  document.querySelectorAll('#chap button').forEach((b, k) => b.classList.toggle('on', k === i));
}
function wrap(g, text, maxW) {
  const lines = []; let line = '';
  for (const ch of text) { if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
  if (line) lines.push(line); return lines;
}
function overlay(i, lt) {
  const s = S[i];
  ctx.drawImage(renderer.domElement, 0, 0);
  if (s.title) {
    const a = Math.min(1, lt / 0.8);
    ctx.fillStyle = `rgba(16,29,43,${0.78 * a})`; ctx.fillRect(0, 70, W, 170);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = 'bold 54px "Yu Gothic","Hiragino Sans",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.cap[0], W / 2, 150); ctx.font = '30px "Yu Gothic","Hiragino Sans",sans-serif'; ctx.fillText(s.cap[1], W / 2, 205); ctx.textAlign = 'left';
    return;
  }
  // 場面名(左上)
  ctx.font = 'bold 30px "Yu Gothic","Hiragino Sans",sans-serif';
  const nw = ctx.measureText(s.name).width + 36;
  ctx.fillStyle = 'rgba(46,123,214,0.92)'; ctx.fillRect(24, 22, nw, 52);
  ctx.fillStyle = '#fff'; ctx.fillText(s.name, 42, 58);
  // 字幕(下)
  ctx.font = 'bold 27px "Yu Gothic","Hiragino Sans",sans-serif';
  const l1 = wrap(ctx, s.cap[0], W - 120);
  ctx.font = '23px "Yu Gothic","Hiragino Sans",sans-serif';
  const l2 = wrap(ctx, s.cap[1], W - 120);
  const hh = 26 + l1.length * 38 + l2.length * 32;
  ctx.fillStyle = 'rgba(16,29,43,0.78)'; ctx.fillRect(0, H - hh, W, hh);
  let y = H - hh + 40;
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 27px "Yu Gothic","Hiragino Sans",sans-serif';
  l1.forEach((l) => { ctx.fillText(l, 60, y); y += 38; });
  ctx.fillStyle = '#cfe3f7'; ctx.font = '23px "Yu Gothic","Hiragino Sans",sans-serif';
  l2.forEach((l) => { ctx.fillText(l, 60, y); y += 32; });
  // 進行バー
  const T = starts[i] + lt;
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = '#2e7bd6'; ctx.fillRect(0, H - 6, W * T / total, 6);
}
function renderAt(T) {
  T = Math.max(0, Math.min(total - 0.001, T));
  let i = 0; while (i < S.length - 1 && T >= starts[i + 1]) i++;
  setScene(i);
  const lt = T - starts[i];
  S[i].update(lt, G);
  renderer.render(scene, camera);
  overlay(i, lt);
  bar.value = Math.round(T / total * 1000);
  const f = (x) => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  timeEl.textContent = f(T) + ' / ' + f(total);
}
const bar = document.getElementById('bar'), timeEl = document.getElementById('time'), playB = document.getElementById('play');
const chap = document.getElementById('chap');
S.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => { T0 = starts[i]; if (!playing) renderAt(T0); }; chap.appendChild(b); });
let playing = false, T0 = 0, last = 0;
function loop(now) {
  if (!playing) return;
  T0 += (now - last) / 1000; last = now;
  if (T0 >= total) { T0 = total - 0.001; renderAt(T0); playing = false; playB.textContent = '▶ 再生'; onEnd && onEnd(); return; }
  renderAt(T0); requestAnimationFrame(loop);
}
let onEnd = null;
function play() { if (T0 >= total - 0.01) T0 = 0; playing = true; last = performance.now(); playB.textContent = '⏸ 一時停止'; requestAnimationFrame(loop); }
function pause() { playing = false; playB.textContent = '▶ 再生'; }
playB.onclick = () => (playing ? pause() : play());
out.onclick = () => (playing ? pause() : play());
bar.oninput = () => { T0 = bar.value / 1000 * total; renderAt(T0); };
document.getElementById('prev').onclick = () => { const i = Math.max(0, cur - (T0 - starts[cur] < 1 ? 1 : 0)); T0 = starts[i]; renderAt(T0); };
document.getElementById('next').onclick = () => { const i = Math.min(S.length - 1, cur + 1); T0 = starts[i]; renderAt(T0); };
// 動画ファイルとして保存(再生しながら記録)
document.getElementById('rec').onclick = () => {
  if (!window.MediaRecorder) { alert('このブラウザでは保存できません'); return; }
  const stream = out.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    window.__lastVideo = blob;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jikken9-tejun.webm'; a.click();
  };
  T0 = 0; onEnd = () => { onEnd = null; setTimeout(() => rec.stop(), 300); };
  rec.start(500); play();
};
window.__video = { total, renderAt, starts, S };
window.__autoRec = (url) => {
  const stream = out.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  window.__recState = 'recording';
  rec.onstop = async () => { const blob = new Blob(chunks, { type: 'video/webm' }); window.__recState = 'uploading ' + blob.size; const r = await fetch(url, { method: 'POST', body: blob }); window.__recState = 'done ' + blob.size + ' ' + (await r.text()); };
  T0 = 0; onEnd = () => { onEnd = null; setTimeout(() => rec.stop(), 300); };
  rec.start(1000); play();
};
renderAt(0);
})();
</script>
